name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: true
      - name: Render demo images
        run: lake exe uvl-demo
      - name: Benchmark
        run: lake exe uvl-bench
      - uses: actions/upload-artifact@v4
        with:
          name: demo-images
          path: out/*.png

  desktop:
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 3.2.24
    steps:
      - uses: actions/checkout@v4
      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-${{ runner.os }}
      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev libasound2-dev libpulse-dev
          curl -sSL -o sdl.tgz https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-$SDL_VERSION.tar.gz
          tar xzf sdl.tgz
          cmake -S SDL3-$SDL_VERSION -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=/opt/sdl3
          cmake --build sdl-build --parallel
          sudo cmake --install sdl-build
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Build the SDL3 window app
        run: lake build uvl-counter
        env:
          PKG_CONFIG_PATH: /opt/sdl3/lib/pkgconfig
      - name: Smoke test (offscreen window, real SDL click)
        run: |
          UVL_MAX_FRAMES=2 UVL_CLICK_TARGET=1 UVL_SCREENSHOT=counter-window.png \
            timeout 60 .lake/build/bin/uvl-counter
          test -s counter-window.png
        env:
          SDL_VIDEO_DRIVER: offscreen
          LD_LIBRARY_PATH: /opt/sdl3/lib
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot
          path: counter-window.png

  web:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.12
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Cache the wasm Lean runtime and Init
        uses: actions/cache@v4
        with:
          path: .lake/build/wasm
          key: wasm-${{ hashFiles('lean-toolchain') }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('web/build.sh') }}
      - name: Build the browser app
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          web/build.sh
      - name: Browser smoke test (headless Chromium, WebGPU on lavapipe + Canvas 2D)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node web/smoke.cjs web/dist web-webgpu.png
          UVL_BACKEND=canvas2d node web/smoke.cjs web/dist web-counter.png
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: |
            web/dist
            web-counter.png
