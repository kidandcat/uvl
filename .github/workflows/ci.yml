name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: true
      - name: Render demo images
        run: lake exe uviz-demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-images
          path: out/*.png
