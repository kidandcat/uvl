name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lakefile version matches CHANGELOG
        run: scripts/check-version.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: true
      - name: Render demo images
        run: lake exe uvl-demo
      - name: Benchmark
        run: lake exe uvl-bench
      - uses: actions/upload-artifact@v4
        with:
          name: demo-images
          path: out/*.png

  desktop:
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 3.2.24
    steps:
      - uses: actions/checkout@v4
      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-${{ runner.os }}
      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev libasound2-dev libpulse-dev
          curl -sSL -o sdl.tgz https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-$SDL_VERSION.tar.gz
          tar xzf sdl.tgz
          cmake -S SDL3-$SDL_VERSION -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=/opt/sdl3
          cmake --build sdl-build --parallel
          sudo cmake --install sdl-build
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Build the SDL3 window app and the GPU check (fetches wgpu-native)
        run: lake build uvl-counter uvl-controls uvl-gpu-check
        env:
          PKG_CONFIG_PATH: /opt/sdl3/lib/pkgconfig
      - name: Install Vulkan (Mesa lavapipe) and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 xvfb
      - name: GPU renderer vs CPU rasterizer (headless wgpu-native)
        run: .lake/build/bin/uvl-gpu-check
      - name: Smoke test, CPU fallback (offscreen window, real SDL click)
        run: |
          UVL_MAX_FRAMES=2 UVL_CLICK_TARGET=1 UVL_SCREENSHOT=counter-window.png \
            timeout 60 .lake/build/bin/uvl-counter 2>&1 | tee cpu.log
          grep -q "CPU renderer" cpu.log
          test -s counter-window.png
        env:
          SDL_VIDEO_DRIVER: offscreen
          LD_LIBRARY_PATH: /opt/sdl3/lib
      - name: Smoke test, GPU renderer (X11 window on Xvfb, real SDL click)
        run: |
          UVL_MAX_FRAMES=2 UVL_CLICK_TARGET=1 UVL_SCREENSHOT=counter-window-gpu.png \
            timeout 60 xvfb-run -a .lake/build/bin/uvl-counter 2>&1 | tee gpu.log
          grep -q "GPU renderer" gpu.log
          test -s counter-window-gpu.png
          # the controls example: a real click on a checkbox, GPU frame checked against the CPU
          UVL_MAX_FRAMES=2 UVL_CLICK_TARGET=2 UVL_SCREENSHOT=controls-window-gpu.png \
            timeout 60 xvfb-run -a .lake/build/bin/uvl-controls 2>&1 | tee controls.log
          grep -q "0 channels off by more than 2" controls.log
        env:
          SDL_VIDEO_DRIVER: x11
          LD_LIBRARY_PATH: /opt/sdl3/lib
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot
          path: counter-window.png

  web:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.12
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Cache the wasm Lean runtime and Init
        uses: actions/cache@v4
        with:
          path: .lake/build/wasm
          key: wasm-${{ hashFiles('lean-toolchain') }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('web/build.sh') }}
      - name: Build the browser apps (counter, dashboard, text, controls)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          web/build.sh
          UVL_DIST=web/dist-dashboard web/build.sh Examples.DashboardWeb
          UVL_DIST=web/dist-text web/build.sh Examples.TextWeb
          UVL_DIST=web/dist-controls web/build.sh Examples.ControlsWeb
      - name: Browser smoke tests (headless Chromium, WebGPU on lavapipe + Canvas 2D)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          # GPU renderer (default), CPU frames presented by WebGPU, Canvas 2D
          node web/smoke.cjs web/dist web-gpu.png
          UVL_BACKEND=webgpu node web/smoke.cjs web/dist web-webgpu.png
          UVL_BACKEND=canvas2d node web/smoke.cjs web/dist web-counter.png
          # a heavier scene on the GPU renderer: paths, gradients, shadows, text
          UVL_STATIC=1 UVL_SIZE=800x600 node web/smoke.cjs web/dist-dashboard web-dashboard.png
          # stateful controls with real input: slider drag, typing, wheel (GPU and Canvas 2D)
          UVL_CONTROLS=1 UVL_SIZE=960x360 node web/smoke.cjs web/dist-controls web-controls-gpu.png
          UVL_BACKEND=canvas2d UVL_CONTROLS=1 UVL_SIZE=960x360 node web/smoke.cjs web/dist-controls web-controls.png
          # TrueType outlines and MSDF glyphs (persistent GPU atlas)
          UVL_STATIC=1 UVL_SIZE=560x560 node web/smoke.cjs web/dist-text web-text.png
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: |
            web/dist
            web-counter.png
            web-dashboard.png
            web-text.png
            web-controls.png

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
      - name: Cache the Android Lean runtime and Init
        uses: actions/cache@v4
        with:
          path: .lake/build/android
          key: android-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('android/build.sh') }}
      - name: Build the APK (arm64-v8a for phones, x86_64 for the emulator)
        run: ANDROID_ABIS="arm64-v8a x86_64" android/build.sh
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          pip install pillow
      - name: Smoke test on an emulator (launch, tap, type)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: android/smoke.sh android/dist/uvl-example.apk android/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-app
          path: |
            android/dist/uvl-example.apk
            android/smoke/*.png
