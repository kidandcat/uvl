<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uvl · counter</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f2f2f2; font: 14px system-ui, sans-serif; }
    main { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px; }
    canvas { width: 480px; height: 360px; max-width: 100%; outline: none; touch-action: none;
             box-shadow: 0 2px 12px rgb(0 0 0 / 0.15); background: white; }
    #status { color: #666; }
  </style>
</head>
<body>
  <main>
    <canvas id="app" tabindex="0"></canvas>
    <div id="status">loading…</div>
  </main>
  <script src="uvl.js"></script>
  <script type="module">
    import { startUVL } from './uvl-web.js';
    const status = document.getElementById('status');
    try {
      const backend = new URLSearchParams(location.search).get('backend');
      window.uvl = await startUVL(document.getElementById('app'), createUVL, { backend });
      status.textContent = `Lean → WebAssembly · ${window.uvl.state.backend}`;
    } catch (e) {
      status.textContent = `error: ${e.message}`;
      throw e;
    }
  </script>
</body>
</html>
